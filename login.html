<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NAVKAR – Login</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,600,700"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Roboto", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #26b99a 0%, #15a7c1 100%);
      }

      .login-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 48px 40px 40px;
        width: 100%;
        max-width: 400px;
      }

      .login-logo {
        text-align: center;
        margin-bottom: 32px;
      }

      .login-logo h1 {
        font-size: 32px;
        font-weight: 700;
        color: #f32121;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      .login-logo p {
        font-size: 13px;
        color: #888;
        margin-top: 4px;
        letter-spacing: 1px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #555;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        font-family: "Roboto", sans-serif;
        color: #333;
        outline: none;
        transition: border-color 0.2s;
      }

      .form-group input:focus {
        border-color: #f32121;
      }

      .login-btn {
        width: 100%;
        padding: 14px;
        background: #f32121;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        font-family: "Roboto", sans-serif;
        letter-spacing: 0.5px;
        cursor: pointer;
        margin-top: 8px;
        transition:
          background 0.2s,
          box-shadow 0.2s;
        box-shadow: 0 4px 14px rgba(243, 33, 33, 0.4);
      }

      .login-btn:hover {
        background: #c0392b;
        box-shadow: 0 6px 18px rgba(243, 33, 33, 0.5);
      }

      .error-msg {
        display: none;
        background: #fff3f3;
        border: 1px solid #f32121;
        color: #c0392b;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 16px;
        text-align: center;
      }

      .expired-msg {
        display: none;
        background: #fff8e1;
        border: 1px solid #ffc107;
        color: #856404;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 16px;
        text-align: center;
      }

      @media (max-width: 440px) {
        .login-card {
          padding: 36px 24px 32px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="login-logo">
        <h1>NAVKAR</h1>
        <p>Bill Management System</p>
      </div>

      <div class="expired-msg" id="expiredMsg">
        Your session has expired. Please login again.
      </div>

      <div class="error-msg" id="errorMsg">Invalid username or password.</div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            placeholder="Enter username"
            autocomplete="username"
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="login-btn">Login</button>
      </form>

      <p
        style="
          margin-top: 24px;
          text-align: center;
          font-size: 13px;
          color: #888;
          line-height: 1.6;
        "
      >
        <strong style="color: #333">NAVAKAR</strong><br />
        Incase of Trouble Logging In ReachOut to <br />
        <a
          href="tel:+919121665885"
          style="
            color: #f32121;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
          "
          >+91 9121665885</a
        >
      </p>
    </div>

    <script>
      // Show expired session message if redirected with ?expired=1
      (function () {
        if (window.location.search.indexOf("expired=1") !== -1) {
          document.getElementById("expiredMsg").style.display = "block";
        }
      })();

      // Credentials — username is plain, password is SHA-256 hashed (not the real password)
      var VALID_USERNAME = "admin";
      var VALID_PASSWORD_HASH = "7676aaafb027c825bd9abab78b234070e702752f625b752e55e55b48e607e358";

      var LOGIN_KEY = "nk_loggedIn";
      var TIME_KEY = "nk_loginTime";

      // Hash a string using SHA-256 via Web Crypto API
      function hashPassword(password) {
        var msgBuffer = new TextEncoder().encode(password);
        return crypto.subtle.digest("SHA-256", msgBuffer).then(function (hashBuffer) {
          var hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
        });
      }

      // If already logged in and not expired, go straight to app
      (function () {
        var loggedIn = localStorage.getItem(LOGIN_KEY);
        var loginTime = localStorage.getItem(TIME_KEY);
        if (loggedIn && loginTime) {
          var elapsed = Date.now() - parseInt(loginTime, 10);
          var expiryMs = 30 * 24 * 60 * 60 * 1000;
          if (elapsed < expiryMs) {
            window.location.replace("index.html");
          }
        }
      })();

      function handleLogin(e) {
        e.preventDefault();
        var username = document.getElementById("username").value.trim();
        var password = document.getElementById("password").value;
        var errorMsg = document.getElementById("errorMsg");

        hashPassword(password).then(function (hash) {
          if (username === VALID_USERNAME && hash === VALID_PASSWORD_HASH) {
            errorMsg.style.display = "none";
            localStorage.setItem(LOGIN_KEY, "1");
            localStorage.setItem(TIME_KEY, Date.now().toString());
            window.location.replace("index.html");
          } else {
            errorMsg.style.display = "block";
            document.getElementById("password").value = "";
          }
        });
      }
    </script>
  </body>
</html>
